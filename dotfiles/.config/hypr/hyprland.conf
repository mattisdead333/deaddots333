source = ~/.cache/wal/colors-hyprland.conf

monitor = DP-3,1920x1080@165.0,0x0,1.0
monitor = HDMI-A-1,1440x900@75.0,1920x272,1.0

$terminal = kitty
$fileManager = nautilus
$menu = pkill wofi || wofi -n
$logout = pkill wlogout || wlogout -b 2

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hypridle
exec-once = ~/.config/waybar/scripts/launch.sh
exec-once = swww-daemon
exec-once = sleep .5 && swww restore
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = nm-applet
exec-once = hyprsunset

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,12

general { 
    
        gaps_in = 4
            gaps_out = 20
            border_size = 2
            col.active_border = $color4
            col.inactive_border = $color1
            resize_on_border = true
            allow_tearing = false
            layout = dwindle
}
decoration {
    rounding = 15
        active_opacity = 0.80
        inactive_opacity = 0.7
        fullscreen_opacity = 1
        blur {
            enabled = true
                size = 1
                passes = 2
                new_optimizations = true
                ignore_opacity = true
                xray = false
                popups = true
        }
    shadow {
        enabled = true
            range = 15
            render_power = 5
            color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    kb_layout = us
        follow_mouse = 1
        sensitivity = 0
        touchpad {
            natural_scroll = true
        }
}

##gestures {
    ##workspace_swipe = true
        ##workspace_swipe_distance = 300
        ##workspace_swipe_cancel_ratio = .05
        ##workspace_swipe_min_speed_to_force = 0
#}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

$mainMod = ALT

bind = $mainMod CTRL, DELETE, exec, pkill htop || pypr toggle taskbar
bind = $mainMod, I, exec, pkill btm || kitty -e btm
bind = $mainMod, B, exec, pkill wofi || ~/.config/waybar/scripts/select.sh
bind = $mainMod, U, exec, ~/.config/waybar/scripts/refresh.sh
bind = $mainMod, P, exec, pkill wofi || ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod, Z, exec, pkill swaync-client || swaync-client -t -sw
bind = $mainMod, W, killactive
bind = $mainMod, F4, killactive
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, E, exec, $menu
bind = $mainMod, K, pseudo 
bind = $mainMod, J, togglesplit
bind = $mainMod, H, togglefloating
bind = SUPER, F, fullscreen
bind = $mainMod, DEL, exit
bind = $mainMod SUPER, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod, minus, exec, ddcutil setvcp 10 -5
bind = $mainMod, X, exec, ddcutil setvcp 10 +5
bind = $mainMod SUPER, L, exec, ~/.config/hypr/scripts/sleep_wake_function.sh
bind = $mainMod, M, exec, pkill pulsemixer || pypr toggle music
bind = $mainMod, ESCAPE, exec, $logoutq
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, exec, pkill kitty-dropterm || pypr toggle term
bind = $mainMod, l, exec, hyprlock
bind = $mainMod, A, exec, spotify-launcher
bind = $mainMod, S, exec, firefox
bind = $mainMod, D, exec, discord
bind = $mainMod, R, exec, gnome-disks
bind = $mainMod, T, exec, obs
bind = $mainMod, C, exec, code
bind = $mainMod, N, exec, obsidian
bind = $mainMod, V, exec, vlc
bind = $mainMod, G, exec, steam
bind = $mainMod, Tab, exec, pkill wofi || ~/.config/hypr/scripts/window_switcher.sh

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
#bind = $mainMod, r, exec, ~/.config/swaync/refresh.sh
#bind = CTRL, ESCAPE, exec, gksu #Dont worry about this
#bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
#bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

#bindl = , XF86AudioNext, exec, playerctl next
#bindl = , XF86AudioPause, exec, playerctl play-pause
#bindl = , XF86AudioPlay, exec, playerctl play-pause
#bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d 
bind = CTRL, Print, exec, hyprshot -m region -o ~/Screenshots/
bind = , Print, exec, hyprshot -m window -o ~/Screenshots/
bind = $mainMod, Print, exec, hyprshot -m active -m output -o ~/Screenshots/

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window
layerrule = noanim, selection

workspace = 1, monitor:DP-3,
workspace = 2, monitor:DP-3,
workspace = 3, monitor:DP-3,
workspace = 4, monitor:DP-3,
workspace = 5, monitor:DP-3,
workspace = 6, monitor:HDMI-A-1,
workspace = 7, monitor:HDMI-A-1,
workspace = 8, monitor:HDMI-A-1,
workspace = 9, monitor:HDMI-A-1,
workspace = 0, monitor:HDMI-A-1

windowrulev2 = idleinhibit fullscreen, class:.*
